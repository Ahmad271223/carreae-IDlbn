name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  verify:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: careerid
          POSTGRES_PASSWORD: careerid_dev
          POSTGRES_DB: careerid
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U careerid"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10
      minio:
        image: bitnami/minio:latest
        env:
          MINIO_ROOT_USER: careerid-dev
          MINIO_ROOT_PASSWORD: careerid-dev-secret
        ports:
          - 9000:9000
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 9

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install
        run: pnpm install --frozen-lockfile

      - name: Install Playwright Chromium (PDF rendering)
        run: pnpm --filter @careerid/api exec playwright install --with-deps chromium

      # Milestone cycle (docs/ROADMAP.md): BUILD → TYPECHECK → LINT → TEST → SECURITY CHECK
      - name: Build
        run: pnpm build

      - name: Typecheck
        run: pnpm typecheck

      - name: Lint
        run: pnpm lint

      - name: Test
        run: pnpm test

      - name: Security check (dependency audit)
        run: pnpm audit --prod --audit-level high

      - name: Security check (no secrets committed)
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  # Deployability gate: both production images must build on main.
  images:
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/main'
    needs: verify
    steps:
      - uses: actions/checkout@v4
      - name: Build API image
        run: docker build -f apps/api/Dockerfile -t careerid-api:ci .
      - name: Build web image
        run: docker build -f apps/web/Dockerfile -t careerid-web:ci .
