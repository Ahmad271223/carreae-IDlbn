name: careerid-dev

services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: careerid
      POSTGRES_PASSWORD: careerid_dev
      POSTGRES_DB: careerid
    ports:
      - "5432:5432"
    volumes:
      - ./volumes/postgres:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U careerid"]
      interval: 5s
      timeout: 3s
      retries: 10

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

  minio:
    image: minio/minio:latest
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: careerid-dev
      MINIO_ROOT_PASSWORD: careerid-dev-secret
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - ./volumes/minio:/data

  clamav:
    image: clamav/clamav:stable
    ports:
      - "3310:3310"

  mailpit:
    image: axllent/mailpit:latest
    ports:
      - "1025:1025"
      - "8025:8025"
